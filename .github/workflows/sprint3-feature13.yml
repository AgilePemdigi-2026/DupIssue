name: Sprint 3 Feature 13 — Dashboard Statistik Regression

on:
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'
      - 'deploy/entrypoint.sh'
      - '.github/workflows/sprint3-feature13.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  feature13:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure PHP and SQLite
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, dom, xml, pdo_sqlite, sqlite3, fileinfo, curl
          coverage: none
          tools: composer:v2

      - name: Install locked dependencies
        run: composer install --no-interaction --prefer-dist --no-progress --optimize-autoloader

      - name: Prepare isolated test environment
        shell: bash
        run: |
          set -euo pipefail
          php -r '
            $xml = simplexml_load_file("phpunit.xml");
            if ($xml === false) { exit(1); }
            $env = [];
            foreach ($xml->php->env as $item) { $env[(string)$item["name"]] = (string)$item["value"]; }
            if (($env["DB_CONNECTION"] ?? null) !== "sqlite" ||
                ($env["DB_DATABASE"] ?? null) !== ":memory:" ||
                ($env["DB_URL"] ?? null) !== "") {
              fwrite(STDERR, "Unsafe PHPUnit environment\n"); exit(1);
            }
          '
          test ! -f bootstrap/cache/config.php
          app_key="$(php -r 'echo "base64:".base64_encode(random_bytes(32));')"
          {
            echo 'APP_NAME=DupIssue-Sprint3-CI'
            echo 'APP_ENV=testing'
            echo "APP_KEY=$app_key"
            echo 'APP_DEBUG=true'
            echo 'APP_URL=http://localhost'
            echo 'DB_CONNECTION=sqlite'
            echo 'DB_DATABASE=:memory:'
            echo 'DB_URL='
            echo 'SESSION_DRIVER=array'
            echo 'CACHE_STORE=array'
            echo 'QUEUE_CONNECTION=sync'
            echo 'MAIL_MAILER=array'
            echo 'NLP_SERVICE_URL=http://nlp.test'
          } > .env.testing
          cp .env.testing .env

      - name: PHPUnit Feature 13 targeted regression
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ../sprint3-feature13-evidence
          php artisan test --filter='ProjectDashboardTest' \
            2>&1 | tee ../sprint3-feature13-evidence/phpunit-dashboard.log

      - name: Full Laravel regression
        shell: bash
        run: |
          set -euo pipefail
          php artisan test 2>&1 | tee ../sprint3-feature13-evidence/phpunit-full.log

      - name: Prepare guarded Behat memory environment
        shell: bash
        run: |
          set -euo pipefail
          cp .env.behat.example .env.behat
          php -r '
            $f=".env.behat"; $c=file_get_contents($f);
            if (!preg_match("/^APP_ENV=behat$/m", $c) ||
                !preg_match("/^DB_CONNECTION=sqlite$/m", $c) ||
                !preg_match("/^DB_DATABASE=:memory:$/m", $c)) {
              fwrite(STDERR, "Unsafe Behat environment\n"); exit(1);
            }
            $c=preg_replace("/^APP_KEY=.*$/m", "APP_KEY=base64:".base64_encode(random_bytes(32)), $c, 1, $n);
            if ($n!==1 || file_put_contents($f,$c)===false) { exit(1); }
          '
          test ! -f bootstrap/cache/config.php

      - name: Sprint 3 Feature 13 Behat acceptance scenarios
        shell: bash
        env:
          APP_ENV: behat
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'
          DB_URL: ''
        run: |
          set -euo pipefail
          vendor/bin/behat --config=behat.sprint3.dashboard.yml --suite=sprint3_dashboard \
            --format=pretty --no-colors 2>&1 | tee ../sprint3-feature13-evidence/behat-dashboard.log

      - name: PHP syntax checks
        shell: bash
        run: |
          set -euo pipefail
          php -l app/Services/ProjectDashboardService.php
          php -l tests/Feature/ProjectDashboardTest.php
          php -l features/bootstrap/Sprint3DashboardBddContext.php

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sprint3-feature13-regression
          path: sprint3-feature13-evidence/
          if-no-files-found: warn
          retention-days: 30
