name: Sprint 1 BDD (Behat + Mink)

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/bdd-sprint1.yml'
      - 'backend/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/bdd-sprint1.yml'
      - 'backend/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  behat-bdd:
    name: Behat/Mink acceptance tests (no PHPUnit)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure PHP for Behat
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, dom, xml, pdo_sqlite, sqlite3, fileinfo, curl
          coverage: none
          tools: composer:v2

      - name: Install dependencies (locked versions)
        run: composer install --no-interaction --prefer-dist --no-progress --optimize-autoloader

      - name: Prepare isolated in-memory BDD environment
        shell: bash
        env:
          APP_ENV: behat
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'
        run: |
          set -euo pipefail
          cp .env.behat.example .env.behat
          php -r '
            $file = ".env.behat";
            $config = file_get_contents($file);
            if ($config === false ||
                !preg_match("/^APP_ENV=behat$/m", $config) ||
                !preg_match("/^DB_CONNECTION=sqlite$/m", $config) ||
                !preg_match("/^DB_DATABASE=:memory:$/m", $config)) {
                fwrite(STDERR, "Unsafe BDD environment template\n");
                exit(1);
            }
            $key = "base64:" . base64_encode(random_bytes(32));
            $config = preg_replace("/^APP_KEY=.*$/m", "APP_KEY=" . $key, $config, 1, $count);
            if ($count !== 1 || file_put_contents($file, $config) === false) {
                fwrite(STDERR, "Could not prepare BDD app key\n");
                exit(1);
            }
          '
          test -f .env.behat
          test ! -f bootstrap/cache/config.php
          echo "BDD environment: APP_ENV=behat, DB_CONNECTION=sqlite, DB_DATABASE=:memory:"
          echo "No development database, FastAPI live service, or PHPUnit execution."

      - name: Execute Sprint 1 BDD acceptance tests
        shell: bash
        env:
          APP_ENV: behat
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'
        run: |
          set -euo pipefail
          mkdir -p ../bdd-evidence
          vendor/bin/behat --suite=sprint1 --format=progress 2>&1 | tee ../bdd-evidence/behat-sprint1.log

      - name: Publish Behat result summary
        if: always()
        shell: bash
        run: |
          {
            echo '## Sprint 1 — BDD Testing (Behat + Mink)'
            echo ''
            echo 'Scope: Submit Issue, Deteksi Kemiripan NLP, Lihat Status Issue.'
            echo ''
            echo 'Command: `vendor/bin/behat --suite=sprint1 --format=progress`'
            echo ''
            if [ -f ../bdd-evidence/behat-sprint1.log ]; then
              echo '```text'
              tail -n 25 ../bdd-evidence/behat-sprint1.log
              echo '```'
            else
              echo 'Behat was not run; inspect earlier setup steps for errors.'
            fi
            echo ''
            echo 'Only Behat/Mink BDD is executed; PHPUnit is not run.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload BDD execution log as GitHub evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bdd-sprint1-behat-results
          path: bdd-evidence/behat-sprint1.log
          if-no-files-found: warn
          retention-days: 30
