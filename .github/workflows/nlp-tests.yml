
name: NLP Automated Tests

on:
  pull_request:
    branches: [main]
    paths:
      - "nlp-service/**"
      - ".github/workflows/nlp-tests.yml"
  push:
    branches: [main]
    paths:
      - "nlp-service/**"
      - ".github/workflows/nlp-tests.yml"

permissions:
  contents: read

jobs:
  test-nlp:
    name: Test FastAPI NLP
    runs-on: ubuntu-latest
    timeout-minutes: 30

    defaults:
      run:
        working-directory: nlp-service

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: nlp-service/requirements.txt

      - name: Install NLP dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run NLP automated tests
        run: python -m unittest discover -s tests -v
  