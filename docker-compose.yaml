# DupIssue - Coolify Git-based Docker Compose deployment
# Base Directory: /    Docker Compose Location: /docker-compose.yaml
# Secrets are ONLY set in Coolify > Environment Variables; never commit them.
services:
  mysql:
    image: mysql:8.0.46
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: dupissue
      MYSQL_USER: dupissue_app
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set_DB_PASSWORD_in_Coolify}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set_MYSQL_ROOT_PASSWORD_in_Coolify}
    command: ["--default-authentication-plugin=mysql_native_password", "--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 --silent"]
      interval: 10s
      timeout: 5s
      retries: 24
      start_period: 40s

  nlp:
    build:
      context: .
      dockerfile: nlp-service/Dockerfile
    restart: unless-stopped
    environment:
      HF_HOME: /models/huggingface
      PYTHONUNBUFFERED: "1"
    volumes:
      - nlp_model_cache:/models
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 300s

  web:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment: &app_env
      APP_NAME: DupIssue
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: ${APP_KEY:?Set_APP_KEY_in_Coolify}
      APP_URL: ${APP_URL:?Set_APP_URL_in_Coolify}
      LOG_CHANNEL: stderr
      LOG_LEVEL: warning
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_DATABASE: dupissue
      DB_USERNAME: dupissue_app
      DB_PASSWORD: ${DB_PASSWORD:?Set_DB_PASSWORD_in_Coolify}
      DB_URL: ""
      SESSION_DRIVER: database
      SESSION_SECURE_COOKIE: "true"
      CACHE_STORE: database
      QUEUE_CONNECTION: database
      NLP_SERVICE_URL: http://nlp:8000
      MAIL_MAILER: ${MAIL_MAILER:-log}
      MAIL_HOST: ${MAIL_HOST:-localhost}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_SCHEME: ${MAIL_SCHEME:-}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-noreply@example.invalid}
      MAIL_FROM_NAME: DupIssue
      MIGRATE_ON_START: ${MIGRATE_ON_START:-true}
    volumes:
      - app_storage:/var/www/html/storage
    depends_on:
      mysql:
        condition: service_healthy
    expose:
      - "80"
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://127.0.0.1/up >/dev/null"]
      interval: 30s
      timeout: 8s
      retries: 5
      start_period: 120s

  worker-nlp:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      <<: *app_env
      MIGRATE_ON_START: "false"
    volumes:
      - app_storage:/var/www/html/storage
    depends_on:
      web:
        condition: service_healthy
    command: ["php", "artisan", "queue:work", "database", "--queue=nlp", "--sleep=3", "--tries=3", "--timeout=60", "--no-interaction"]

  worker-default:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      <<: *app_env
      MIGRATE_ON_START: "false"
    volumes:
      - app_storage:/var/www/html/storage
    depends_on:
      web:
        condition: service_healthy
    command: ["php", "artisan", "queue:work", "database", "--queue=default", "--sleep=3", "--tries=1", "--timeout=60", "--no-interaction"]

volumes:
  mysql_data:
  nlp_model_cache:
  app_storage:
